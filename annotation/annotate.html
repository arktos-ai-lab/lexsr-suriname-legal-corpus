<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LexSR Verification</title>
<style>
:root {
  --bg: #f7f6f3; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e2e0da;
  --accent: #2d5bd7; --ok: #1f7a4d; --bad: #b3261e; --warn: #9a6400; --mark: #fff1a8;
  --code: #f1efe9;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161618; --panel: #1f1f22; --ink: #ececee; --muted: #9a9aa2; --line: #333338;
    --accent: #7a9cff; --ok: #5cc98f; --bad: #ff7b72; --warn: #e3b341; --mark: #5a4b00;
    --code: #26262a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: var(--panel);
  border-bottom: 1px solid var(--line); padding: 10px 16px;
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
header h1 { font-size: 16px; margin: 0 12px 0 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { border: 1px solid var(--line); background: transparent; color: var(--ink);
  border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; font-size: 13px; }
.tab.active { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.tab small { color: var(--muted); margin-left: 4px; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
main { max-width: 1000px; margin: 0 auto; padding: 16px; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px;
  color: var(--muted); font-size: 13px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.card h2 { font-size: 16px; margin: 0 0 4px; word-break: break-word; }
.id { color: var(--muted); font-size: 12px; font-family: ui-monospace, Consolas, monospace;
  word-break: break-all; }
.field { margin-top: 14px; }
.field label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
  color: var(--muted); margin-bottom: 4px; }
.field pre { margin: 0; white-space: pre-wrap; word-break: break-word; background: var(--code);
  border-radius: 6px; padding: 10px; max-height: 420px; overflow: auto;
  font: 13px/1.5 ui-monospace, Consolas, monospace; }
.field a { color: var(--accent); }
mark { background: var(--mark); color: inherit; padding: 0 2px; border-radius: 3px; }
.question { margin-top: 16px; font-weight: 600; white-space: pre-line; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.v { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px;
  padding: 8px 14px; cursor: pointer; font: inherit; }
.v kbd { color: var(--muted); font-size: 12px; margin-left: 6px; }
.v.correct.on { background: var(--ok); color: #fff; border-color: var(--ok); }
.v.wrong.on { background: var(--bad); color: #fff; border-color: var(--bad); }
.v.unsure.on { background: var(--warn); color: #fff; border-color: var(--warn); }
.v.on kbd { color: inherit; }
textarea { width: 100%; margin-top: 10px; min-height: 56px; }
.nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.status { font-size: 13px; color: var(--muted); }
.status.saved { color: var(--ok); } .status.err { color: var(--bad); }
.help { font-size: 12px; color: var(--muted); margin-top: 16px; }
.empty { padding: 40px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>LexSR verification</h1>
  <div class="tabs" id="tabs"></div>
  <span style="flex:1"></span>
  <label>Annotator <input id="annotator" size="14" placeholder="your name"></label>
</header>
<main>
  <div class="bar">
    <span id="progress"></span>
    <label>Show
      <select id="filter">
        <option value="all">all items</option>
        <option value="todo">not yet labelled</option>
        <option value="wrong">wrong</option>
        <option value="unsure">unsure</option>
        <option value="noted">with a note</option>
      </select>
    </label>
    <label>Go to # <input id="jump" size="4" inputmode="numeric"></label>
  </div>
  <div id="view"></div>
  <p class="help">Keys: <b>1</b> correct, <b>2</b> wrong, <b>3</b> unsure, <b>S</b> skip,
    <b>&larr;/&rarr;</b> previous/next, <b>N</b> next unlabelled, <b>E</b> edit note.
    Every verdict is written to <code>annotation/labels/&lt;task&gt;.jsonl</code> immediately.</p>
</main>
<script>
const $ = (id) => document.getElementById(id);
let tasks = [], task = null, items = [], labels = {}, order = [], pos = 0;

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}
function render(text) {
  const t = esc(text);
  if (/^https?:\/\/\S+$/.test(String(text).trim())) return `<a href="${t}" target="_blank" rel="noopener">${t}</a>`;
  // local source files served by serve.py, one per line
  const lines = String(text).trim().split("\n");
  if (lines[0] && lines.every(l => /^\/raw\/\S+$/.test(l)))
    return lines.map(l => `<a href="${esc(encodeURI(l))}" target="_blank" rel="noopener">${esc(decodeURI(l.slice(5)))}</a>`).join("\n");
  return t.replace(/\[\[([\s\S]*?)\]\]/g, "<mark>$1</mark>");
}
function getAnnotator() { try { return localStorage.getItem("lexsr_annotator") || ""; } catch (e) { return ""; } }
function setAnnotator(v) { try { localStorage.setItem("lexsr_annotator", v); } catch (e) {} }

async function loadTasks() {
  tasks = await (await fetch("/api/tasks")).json();
  $("tabs").innerHTML = tasks.map(t =>
    `<button class="tab ${task === t.name ? "active" : ""}" data-t="${t.name}">${t.name}<small>${t.done}/${t.items}</small></button>`
  ).join("");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => openTask(b.dataset.t));
}

async function openTask(name) {
  task = name;
  const data = await (await fetch("/api/task/" + name)).json();
  items = data.items; labels = data.labels;
  applyFilter(true);
  await loadTasks();
}

function applyFilter(toFirstTodo) {
  const f = $("filter").value;
  order = items.map((_, i) => i).filter(i => {
    const l = labels[items[i].id];
    if (f === "todo") return !l || l.verdict === "skip";
    if (f === "wrong" || f === "unsure") return l && l.verdict === f;
    if (f === "noted") return l && l.note;
    return true;
  });
  pos = 0;
  if (toFirstTodo) {
    const k = order.findIndex(i => !labels[items[i].id]);
    pos = k >= 0 ? k : 0;
  }
  show();
}

function show(status) {
  const done = items.filter(it => labels[it.id] && labels[it.id].verdict !== "skip").length;
  $("progress").textContent = task ? `${task}: ${done} of ${items.length} labelled` : "";
  if (!task) { $("view").innerHTML = `<div class="card empty">Pick a task above.</div>`; return; }
  if (!order.length) { $("view").innerHTML = `<div class="card empty">No items match this filter.</div>`; return; }
  const idx = order[pos], it = items[idx], l = labels[it.id] || {};
  const fields = Object.entries(it.fields).map(([k, v]) =>
    `<div class="field"><label>${esc(k)}</label><pre>${render(v)}</pre></div>`).join("");
  const btn = (v, label, key) =>
    `<button class="v ${v} ${l.verdict === v ? "on" : ""}" data-v="${v}">${label}<kbd>${key}</kbd></button>`;
  $("view").innerHTML = `
    <div class="card">
      <h2>#${idx + 1}: ${esc(it.title)}</h2>
      <div class="id">${esc(it.id)}</div>
      ${fields}
      <div class="question">${esc(it.question)}</div>
      <div class="actions">${btn("correct","Correct","1")}${btn("wrong","Wrong","2")}${btn("unsure","Unsure","3")}${btn("skip","Skip","S")}</div>
      <textarea id="note" placeholder="Note (what is wrong, the right answer, ...)">${esc(l.note || "")}</textarea>
      <div class="nav">
        <button class="v" id="prev">&larr; Previous</button>
        <span class="status ${status ? status.cls : ""}">${status ? esc(status.msg) :
          (l.verdict ? `Labelled ${esc(l.verdict)} by ${esc(l.annotator)} at ${esc(l.at)}` : "Not labelled yet")}</span>
        <button class="v" id="next">Next &rarr;</button>
      </div>
    </div>`;
  document.querySelectorAll(".actions .v").forEach(b => b.onclick = () => label(b.dataset.v));
  $("prev").onclick = () => move(-1);
  $("next").onclick = () => move(1);
}

function move(d) { if (!order.length) return; pos = Math.max(0, Math.min(order.length - 1, pos + d)); show(); }
function nextTodo() {
  for (let k = 1; k <= order.length; k++) {
    const p = (pos + k) % order.length;
    if (!labels[items[order[p]].id]) { pos = p; return show(); }
  }
  show({ msg: "Everything in this view is labelled.", cls: "saved" });
}

async function label(verdict) {
  const annotator = $("annotator").value.trim();
  if (!annotator) { $("annotator").focus(); return show({ msg: "Enter your name first.", cls: "err" }); }
  const it = items[order[pos]];
  const body = { task, item_id: it.id, verdict, note: $("note").value.trim(), annotator };
  try {
    const r = await fetch("/api/label", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const res = await r.json();
    if (!r.ok) throw new Error(res.error || r.status);
    labels[it.id] = res.label;
    loadTasks();
    if (verdict === "skip" || $("filter").value !== "all") move(1); else nextTodo();
  } catch (e) {
    show({ msg: "Not saved: " + e.message + ". Is serve.py still running?", cls: "err" });
  }
}

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") {
    if (e.key === "Escape") e.target.blur();
    return;
  }
  const k = e.key.toLowerCase();
  if (k === "1") label("correct");
  else if (k === "2") label("wrong");
  else if (k === "3") label("unsure");
  else if (k === "s") label("skip");
  else if (k === "arrowright") move(1);
  else if (k === "arrowleft") move(-1);
  else if (k === "n") nextTodo();
  else if (k === "e") { e.preventDefault(); const n = $("note"); if (n) n.focus(); }
});
$("annotator").value = getAnnotator();
$("annotator").onchange = (e) => setAnnotator(e.target.value.trim());
$("filter").onchange = () => applyFilter(false);
$("jump").onchange = (e) => {
  const n = parseInt(e.target.value, 10) - 1;
  const p = order.indexOf(n);
  if (p >= 0) { pos = p; show(); }
  e.target.value = "";
};
loadTasks().then(() => { if (tasks.length) openTask(tasks[0].name); else show(); });
</script>
</body>
</html>
